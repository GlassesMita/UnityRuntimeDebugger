name: CI

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # HelpTests shell out to `sh` for the help-page examples, which is unavailable on Windows
      # but fine here. The four cases that fail on a Windows dev box pass in this runner.
      - run: dotnet test tests/Core.Tests -c Release
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web

  # Builds the Mono plugin and the drop-in zip. The zip is what users download: the Mono host ships
  # its dependencies as loose assemblies beside the plugin, so a bare DLL is not installable.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Core embeds web/dist into the assembly, so the UI has to be built first.
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: dotnet build src/BepInEx.Mono -c Release
      - name: Pack the drop-in archive
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          stage="dist/UnityRuntimeDebugger.Mono-${version}"
          plugins="${stage}/BepInEx/plugins"
          mkdir -p "${plugins}"
          cp src/BepInEx.Mono/bin/Release/netstandard2.0/*.dll "${plugins}/"
          cp packaging/安装说明.txt "${stage}/" 2>/dev/null || true
          # A lone DLL means the dependency copy silently stopped working; fail loudly instead.
          count="$(find "${plugins}" -name '*.dll' | wc -l)"
          test "${count}" -gt 1 || { echo "only ${count} dll(s) staged"; exit 1; }
          (cd dist && zip -r "UnityRuntimeDebugger.Mono-${version}.zip" "UnityRuntimeDebugger.Mono-${version}")
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "ZIP=dist/UnityRuntimeDebugger.Mono-${version}.zip" >> "$GITHUB_ENV"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: UnityRuntimeDebugger.Mono
          path: dist/UnityRuntimeDebugger.Mono-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Version
        run: test "$GITHUB_REF_NAME" = "$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
      - uses: actions/download-artifact@v8
        with:
          name: UnityRuntimeDebugger.Mono
          path: dist
      - name: Publish the release
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/UnityRuntimeDebugger.Mono-*.zip \
            --title "Unity Runtime Debugger $GITHUB_REF_NAME (BepInEx 6 Mono)" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
